<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | Urban Risk Intelligence Platform</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-card-container">
    <!-- Lado Esquerdo: Mensagem de Boas-Vindas -->
    <div class="welcome-section">
      <div class="welcome-content">
        <h1>BEM-VINDO!!!</h1>
        <h2>URBAN RISK PLATFORM</h2>
        <p>Plataforma integrada de monitoramento de riscos urbanos, alertas em tempo real e rotas de evacuação acessíveis.</p>
      </div>
    </div>

    <!-- Lado Direito: Formulário Branco Flutuante -->
    <div class="form-section">
      <div class="form-header">
        <h2>Conectar</h2>
        <p>Acesse sua conta para continuar</p>
      </div>

      <form id="form-login">
        <div class="input-group">
          <input type="text" id="login-user" placeholder="Nome de Usuário / E-mail" required>
        </div>

        <div class="input-group password-group">
          <input type="password" id="login-password" placeholder="Senha" required>
          <button type="button" id="btn-toggle-password" class="toggle-password">mostrar</button>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="remember">
            <span>Lembrar-me</span>
          </label>
          <a href="#" class="forgot-password">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="btn-signin">Entrar</button>

        <div class="form-footer">
          <span>Não tem uma conta?</span>
          <a href="index-cadastro.html" class="link-signup">Criar Conta</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
